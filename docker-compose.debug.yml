services:
  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage-network

  # Storage Service (Development with Debug enabled)
  storage-service:
    build:
      context: .
      dockerfile: apps/storage-service/Dockerfile.dev
      target: development
      cache_from:
        - storage-service-dev:latest
    container_name: storage-service
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/storage_service
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      # Storage
      DEFAULT_STORAGE_PROVIDER: minio
      MAX_FILE_SIZE: 104857600
      UPLOAD_PATH: /app/uploads
      # Server
      PORT: 4000
      TCP_HOST: 0.0.0.0
      TCP_PORT: 4001
      # MinIO
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: storage
      MINIO_USE_SSL: "false"
      MINIO_ACTIVE: "true"
      # Node
      NODE_ENV: development
      # File watching
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    command:
      - nodemon
      - --config
      - nodemon.json
      - --exec
      - node --inspect=0.0.0.0:9229 -r ts-node/register/transpile-only -r tsconfig-paths/register src/main.ts
    ports:
      - "4000:4000"
      - "4001:4001"
      - "9229:9229" # Debug port
    volumes:
      # Mount source code for hot-reload (use delegated for better performance on macOS, cached on Linux)
      - ./apps/storage-service/src:/app/apps/storage-service/src
      # Mount TypeScript configs
      - ./apps/storage-service/tsconfig.app.json:/app/apps/storage-service/tsconfig.app.json:ro
      - ./apps/storage-service/tsconfig.json:/app/apps/storage-service/tsconfig.json:ro
      - ./apps/storage-service/nodemon.json:/app/apps/storage-service/nodemon.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      # Mount other config files if needed
      - ./apps/storage-service/drizzle.config.ts:/app/apps/storage-service/drizzle.config.ts:ro
      # Preserve node_modules
      - /app/node_modules
      - /app/apps/storage-service/node_modules
      # Mount uploads directory
      - storage_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - storage-network

volumes:
  redis_data:
  storage_uploads:

networks:
  storage-network:
    driver: bridge
