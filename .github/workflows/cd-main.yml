# main: promote :dev Docker image + publish client SDK (npm + optional NuGet)
name: Storage CD (main)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (optional)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote-image:
    name: Promote dev Storage image to production tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      promoted-image: ${{ steps.promote.outputs.promoted_image }}
      promoted-digest: ${{ steps.promote.outputs.promoted_digest }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PASS || secrets.GITHUB_TOKEN }}

      - name: Promote dev image tags
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
          TARGET_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker pull "$SOURCE_IMAGE"
          TARGET_TAGS=("main" "latest")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TARGET_TAGS+=("${{ github.event.inputs.tag }}")
          fi
          for tag in "${TARGET_TAGS[@]}"; do
            TARGET_IMAGE="${TARGET_BASE}:${tag}"
            echo "Promoting to $TARGET_IMAGE"
            docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
            docker push "$TARGET_IMAGE"
          done
          DIGEST="$(docker image inspect "$SOURCE_IMAGE" --format='{{index .RepoDigests 0}}' || true)"
          echo "promoted_image=${TARGET_BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "promoted_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  publish-client:
    name: Publish @yaghmori/storage-service (+ NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@yaghmori"

      - name: Bump patch, build, publish npm
        working-directory: packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NPM_TOKEN secret"
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" \
            ../../sdk/dotnet/Yaghmori.StorageService/Yaghmori.StorageService.csproj
          pnpm run build
          pnpm publish --access public --no-git-checks
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish NuGet (optional)
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_TOKEN:-}" ]; then
            echo "NUGET_TOKEN not set — skip NuGet publish"
            exit 0
          fi
          dotnet pack sdk/dotnet/Yaghmori.StorageService/Yaghmori.StorageService.csproj -c Release -o ./nuget-out
          dotnet nuget push ./nuget-out/*.nupkg \
            --api-key "$NUGET_TOKEN" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/package.json sdk/dotnet/Yaghmori.StorageService/Yaghmori.StorageService.csproj
          if git diff --staged --quiet; then
            echo "No version files to commit"
            exit 0
          fi
          git commit -m "chore(client): bump @yaghmori/storage-service to ${VERSION} [skip ci]"
          git push
