name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: storage-service

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: messaging-contracts
          ref: ${{ github.base_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: storage-service/pnpm-lock.yaml

      - name: Install + typecheck + build
        working-directory: storage-service
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm build

  docker:
    name: Build and push GHCR
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: storage-service

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: messaging-contracts
          ref: ${{ github.ref_name }}

      - name: Vendor contracts into Docker context
        run: |
          set -euo pipefail
          mkdir -p storage-service/vendor
          rm -rf storage-service/vendor/messaging-contracts
          cp -a messaging-contracts storage-service/vendor/messaging-contracts
          rm -rf storage-service/vendor/messaging-contracts/.git

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tags=${IMG}:latest,${IMG}:${SHORT}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMG}:dev,${IMG}:dev-${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: storage-service
          file: storage-service/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
