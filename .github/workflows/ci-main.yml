# Push to `main` → retag existing :dev → :latest + :prod (no rebuild)
name: CD (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  retag:
    name: Retag :dev → :latest / :prod
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image
        run: |
          set -euo pipefail
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "Source: $SOURCE"
          if ! docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
            echo "::error::Missing $SOURCE — push to \`dev\` and wait for CI (dev) to succeed before merging to main."
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${BASE}:latest" \
            --tag "${BASE}:prod" \
            "$SOURCE"

          echo "Retagged $SOURCE → ${BASE}:latest, ${BASE}:prod"
