# Push to `main`: promote the existing GHCR :dev image to production tags.
# Same idea as eallyfe `.github/workflows/api-cd-main.yml` (no rebuild).
name: CD Main — Promote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: Promote :dev → :latest / :main
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image tags
        run: |
          set -euo pipefail
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "Pulling $SOURCE"
          docker pull "$SOURCE"

          for tag in latest main; do
            echo "Promoting to ${BASE}:${tag}"
            docker tag "$SOURCE" "${BASE}:${tag}"
            docker push "${BASE}:${tag}"
          done
