# Push to `dev`: build Docker image and push to GHCR as :dev (+ :sha-<sha>).
# Same idea as eallyfe `.github/workflows/api-ci-dev.yml`.
name: CI Dev — Build and push

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push :dev image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout storage-service
        uses: actions/checkout@v4

      - name: Checkout messaging-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: _messaging-contracts
          ref: dev

      - name: Vendor messaging-contracts for Dockerfile
        run: |
          set -euo pipefail
          rm -rf vendor/messaging-contracts
          mkdir -p vendor
          cp -a _messaging-contracts vendor/messaging-contracts
          rm -rf vendor/messaging-contracts/.git
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies['@platform/messaging-contracts']='file:./vendor/messaging-contracts'; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"
          cd vendor/messaging-contracts
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
          node -e "const fs=require('fs'); const p='package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.scripts) delete j.scripts.prepare; fs.writeFileSync(p, JSON.stringify(j,null,2));"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=storage-service
          cache-to: type=gha,mode=max,scope=storage-service
          platforms: linux/amd64
