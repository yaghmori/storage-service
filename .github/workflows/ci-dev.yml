name: CI Dev — Build and push (dev tags)

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: storage-service

      - name: Checkout messaging-contracts (dev, fallback main)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: messaging-contracts
          ref: dev
        continue-on-error: true

      - name: Fallback messaging-contracts to main
        if: hashFiles('messaging-contracts/package.json') == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: messaging-contracts
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            storage-service/pnpm-lock.yaml
            messaging-contracts/pnpm-lock.yaml

      - name: Install + build messaging-contracts
        working-directory: messaging-contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install + typecheck + build storage-service
        working-directory: storage-service
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm build

  docker:
    name: Build and push GHCR (:dev)
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: storage-service

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: messaging-contracts
          ref: dev
        continue-on-error: true

      - name: Fallback messaging-contracts to main
        if: hashFiles('messaging-contracts/package.json') == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: messaging-contracts
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build + vendor messaging-contracts
        run: |
          set -euo pipefail
          cd messaging-contracts
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          mkdir -p storage-service/vendor/messaging-contracts
          rm -rf storage-service/vendor/messaging-contracts/*
          cp messaging-contracts/package.json storage-service/vendor/messaging-contracts/
          cp messaging-contracts/pnpm-lock.yaml storage-service/vendor/messaging-contracts/ 2>/dev/null || true
          cp messaging-contracts/tsconfig.json storage-service/vendor/messaging-contracts/
          cp -a messaging-contracts/dist storage-service/vendor/messaging-contracts/dist
          cp messaging-contracts/LICENSE storage-service/vendor/messaging-contracts/ 2>/dev/null || true
          node -e "const fs=require('fs'); const p='storage-service/vendor/messaging-contracts/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); delete j.scripts.prepare; fs.writeFileSync(p, JSON.stringify(j,null,2));"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "tags=${IMG}:dev,${IMG}:dev-${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: storage-service
          file: storage-service/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=storage-service
            type=gha,scope=storage-service-dev
          cache-to: type=gha,mode=max,scope=storage-service-dev
