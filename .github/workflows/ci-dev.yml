# Push to `dev` → build image → push :dev + :sha-<sha>
name: CI (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout storage-service
        uses: actions/checkout@v4

      - name: Checkout messaging-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: _messaging-contracts
          ref: dev

      - name: Vendor messaging-contracts
        run: |
          set -euo pipefail
          rm -rf vendor/messaging-contracts
          mkdir -p vendor
          cp -a _messaging-contracts vendor/messaging-contracts
          rm -rf vendor/messaging-contracts/.git
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies['@platform/messaging-contracts']='file:./vendor/messaging-contracts'; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"
          cd vendor/messaging-contracts
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
          node -e "const fs=require('fs'); const p='package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.scripts) delete j.scripts.prepare; fs.writeFileSync(p, JSON.stringify(j,null,2));"

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=storage-service
          cache-to: type=gha,mode=max,scope=storage-service
          platforms: linux/amd64
