# dev branch: build image and push to GHCR
# (tags: dev, sha-<sha>, latest-dev).
# Same pattern as eallyfe `.github/workflows/api-ci-dev.yml`.
name: Storage CI (dev build)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_GHA_CACHE_SCOPE: storage-service

jobs:
  build:
    name: Build & push Storage image (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout messaging-contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/messaging-contracts
          path: _messaging-contracts
          ref: dev

      - name: Vendor messaging-contracts for Dockerfile
        run: |
          set -euo pipefail
          rm -rf vendor/messaging-contracts
          mkdir -p vendor
          cp -a _messaging-contracts vendor/messaging-contracts
          rm -rf vendor/messaging-contracts/.git
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies['@platform/messaging-contracts']='file:./vendor/messaging-contracts'; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"
          cd vendor/messaging-contracts
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
          node -e "const fs=require('fs'); const p='package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.scripts) delete j.scripts.prepare; fs.writeFileSync(p, JSON.stringify(j,null,2));"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Prefer GHCR_PASS (classic PAT with write:packages) — same secret eallyfe uses.
      # Existing packages created outside Actions reject GITHUB_TOKEN with write_package.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PASS || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest-dev

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.DOCKER_GHA_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_GHA_CACHE_SCOPE }}
          platforms: linux/amd64
