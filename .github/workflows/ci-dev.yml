# dev branch: build image and push to GHCR
# (tags: dev, sha-<sha>, latest-dev).
# Same pattern as eallyfe `.github/workflows/api-ci-dev.yml`.
name: Storage CI (dev build)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_GHA_CACHE_SCOPE: storage-service

jobs:
  build:
    name: Build & push Storage image (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Prefer GHCR_PASS (classic PAT with write:packages) — same secret eallyfe uses.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PASS || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest-dev

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.DOCKER_GHA_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_GHA_CACHE_SCOPE }}
          platforms: linux/amd64
