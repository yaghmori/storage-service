services:
  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Storage Service (Development with hot-reload)
  storage-service:
    build:
      context: .
      dockerfile: apps/storage-service/Dockerfile.dev
      target: development
      cache_from:
        - storage-service-dev:latest
    container_name: storage-service
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/storage_service
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      # Storage
      DEFAULT_STORAGE_PROVIDER: minio
      MAX_FILE_SIZE: 104857600
      UPLOAD_PATH: /app/uploads
      # Server
      PORT: 4000
      TCP_HOST: 0.0.0.0
      TCP_PORT: 4001
      # MinIO
      MINIO_ENDPOINT: host.docker.internal
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: storage
      MINIO_USE_SSL: "false"
      MINIO_ACTIVE: "true"
      # Node
      NODE_ENV: development
      # File watching (for Docker on Windows)
      # tsx uses chokidar and TypeScript compiler for file watching
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      # Mount entire workspace for hot-reload (source code changes)
      # On Windows, ensure Docker Desktop has file sharing enabled for this drive
      - .:/app
      # Preserve node_modules (use named volume or keep container's node_modules)
      - /app/node_modules
      - /app/apps/storage-service/node_modules
      # Mount uploads directory
      - storage_uploads:/app/uploads
    restart: unless-stopped
    # Improve file watching on Windows
    stdin_open: true
    tty: true

volumes:
  redis_data:
  storage_uploads:
