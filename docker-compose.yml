services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: storage
      POSTGRES_DB: storage_service
    ports:
      - "5434:5432"
    volumes:
      - storage_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage -d storage_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_minio:/data

  storage-service:
    build:
      context: .
      dockerfile: Dockerfile
    # Before build: mkdir -p vendor && cp -r ../messaging-contracts vendor/messaging-contracts
    ports:
      - "4000:4000"
      - "4002:4002"
    environment:
      NODE_ENV: development
      PORT: 4000
      TCP_PORT: 4002
      DATABASE_URL: postgresql://storage:storage@postgres:5432/storage_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_PATH: /app/uploads
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: storage
      MINIO_USE_SSL: "false"
    volumes:
      - storage_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  storage_pg:
  storage_minio:
  storage_uploads:
