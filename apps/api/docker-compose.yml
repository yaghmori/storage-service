# Standalone stack: postgres + redis + minio + 1 API + 1 worker.
# Scale workers when backlog needs it:
#   docker compose up -d --scale worker=2

x-storage-env: &storage-env
  NODE_ENV: development
  HOST: ${HOST:-0.0.0.0}
  PORT: ${PORT:-6100}
  TCP_HOST: ${TCP_HOST:-0.0.0.0}
  TCP_PORT: ${TCP_PORT:-6001}
  DATABASE_URL: postgresql://storage:storage@postgres:5432/storage_service
  REDIS_HOST: redis
  REDIS_PORT: 6379
  UPLOAD_PATH: /app/uploads
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_PUBLIC_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: storage
  MINIO_USE_SSL: "false"
  MAX_FILE_SIZE: "104857600"
  DIRECT_UPLOAD_MAX_FILE_SIZE: "5368709120"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  RATE_LIMIT_EXEMPT_SERVICE_NAMES: migration,storage-migrate,eallyfe-migrate

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: storage
      POSTGRES_DB: storage_service
    ports:
      - "5434:5432"
    volumes:
      - storage_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage -d storage_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_minio:/data

  clamav:
    image: clamav/clamav:stable
    volumes:
      - storage_clamav:/var/lib/clamav
    # Workers reach clamd at clamav:3310 (virus-scan processor)

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-6100}:${PORT:-6100}"
      - "${TCP_PORT:-6001}:${TCP_PORT:-6001}"
    environment:
      <<: *storage-env
      ENABLE_HTTP: "true"
      ENABLE_TCP: "true"
      ENABLE_WORKERS: "false"
      ENABLE_CRONS: "false"
    volumes:
      - storage_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *storage-env
      ENABLE_HTTP: "false"
      ENABLE_TCP: "false"
      ENABLE_WORKERS: "true"
      ENABLE_CRONS: "true"
    volumes:
      - storage_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started

volumes:
  storage_pg:
  storage_minio:
  storage_uploads:
  storage_clamav:
